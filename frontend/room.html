<!DOCTYPE html>
<html lang="he" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedScript — Trauma Room</title>
  <script>tailwind={config:{darkMode:'class'}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

    /* ─── Panel system ─────────────────────────── */
    .panel{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;transition:flex .3s cubic-bezier(.4,0,.2,1)}
    .panel.minimized{flex:0 0 40px!important}
    .panel-body{flex:1;overflow:hidden;transition:opacity .2s}
    .panel.minimized .panel-body{opacity:0;pointer-events:none;overflow:hidden}
    .panel-min-label{display:none;writing-mode:vertical-lr;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#8a8070;white-space:nowrap;padding:8px 0;cursor:pointer}
    .panel.minimized .panel-min-label{display:flex;align-items:center;justify-content:center;flex:1}
    .panel.minimized .panel-header-content{display:none}
    .panel-header{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--b);flex-shrink:0;gap:8px;min-height:44px}
    .panel.minimized .panel-header{justify-content:center;padding:8px 4px}

    /* ─── ACLS Flowchart ────────────────────────── */
    .fn-node{border-radius:6px;padding:6px 10px;cursor:pointer;transition:all .15s;border:1.5px solid;user-select:none;margin-bottom:0}
    .fn-node:hover{filter:brightness(.95)}
    .fn-action{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
    .fn-action.done{background:#f0fdf4;border-color:#86efac;color:#166534}
    .fn-action.active{background:#fef3c7;border-color:#fcd34d;color:#92400e}
    .fn-shock{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
    .fn-shock.done{background:#f0fdf4;border-color:#86efac;color:#166534}
    .fn-decision{background:#fdf4ff;border-color:#e879f9;color:#701a75;border-radius:6px;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);padding:14px 10px;text-align:center}
    .fn-decision.done{background:#f0fdf4;border-color:#86efac}
    .fn-start,.fn-end{background:#f8fafc;border-color:#94a3b8;color:#1e293b;border-radius:20px}
    .fn-end.done{background:#f0fdf4;border-color:#86efac;color:#166534}
    .fn-arrow{display:flex;justify-content:center;align-items:center;height:20px;color:#94a3b8;font-size:16px;line-height:1}
    .fn-branch-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fn-branch-label{font-size:10px;font-weight:700;text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.05em}

    /* dark flowchart */
    .dark .fn-action{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd}
    .dark .fn-action.done{background:#14532d;border-color:#22c55e;color:#86efac}
    .dark .fn-action.active{background:#451a03;border-color:#f59e0b;color:#fcd34d}
    .dark .fn-shock{background:#450a0a;border-color:#ef4444;color:#fca5a5}
    .dark .fn-shock.done{background:#14532d;border-color:#22c55e;color:#86efac}
    .dark .fn-decision{background:#2e1065;border-color:#a855f7;color:#d8b4fe}
    .dark .fn-start,.dark .fn-end{background:#1e293b;border-color:#475569;color:#cbd5e1}
    .dark .fn-end.done{background:#14532d;border-color:#22c55e;color:#86efac}

    /* ─── Transcript ────────────────────────────── */
    .t-entry{border-left:3px solid var(--sc);padding-left:10px}
    @keyframes entryflash{from{background:rgba(193,95,60,.12)}to{background:transparent}}
    .entry-new{animation:entryflash .8s ease-out}
    .kw-protocol{background:rgba(239,68,68,.13);color:#dc2626;border-radius:3px;padding:0 2px;font-weight:600}
    .kw-timer{background:rgba(193,95,60,.15);color:#a04e31;border-radius:3px;padding:0 2px;font-weight:600}
    .dark .kw-protocol{background:rgba(239,68,68,.25);color:#f87171}
    .dark .kw-timer{background:rgba(251,191,36,.2);color:#fbbf24}

    /* ─── MoH form ──────────────────────────────── */
    .f-section{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--b)}
    .f-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:#8a8070;margin-bottom:4px}
    .dark .f-label{color:#a8a29e}
    .si{padding:4px 7px;font-size:11px;border-radius:5px;border:1px solid var(--b);background:white;outline:none;color:#1e1e1c;transition:border-color .15s}
    .si:focus{border-color:#c15f3c;box-shadow:0 0 0 2px rgba(193,95,60,.2)}
    .dark .si{background:#252420;color:#e8e5e0}
    .si[readonly]{opacity:.7;cursor:default}
    .cb-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;cursor:pointer}
    .cb-row input[type=checkbox]{accent-color:#c15f3c;width:12px;height:12px;flex-shrink:0}
    .med-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;align-items:center;font-size:10px;padding:2px 0}
    .med-name{font-size:10px;font-weight:600;color:#374151}
    .dark .med-name{color:#d1d5db}

    /* ─── Timers ────────────────────────────────── */
    @keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
    .timer-card{animation:slideIn .25s ease-out}

    /* ─── Misc ──────────────────────────────────── */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#d1c5b8;border-radius:3px}
    .dark ::-webkit-scrollbar-thumb{background:#52525b}
    @keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}
    .livepulse{animation:livepulse 1.4s ease-in-out infinite}
    @keyframes bar1{0%,100%{height:8px}50%{height:18px}}
    @keyframes bar2{0%,100%{height:14px}50%{height:6px}}
    @keyframes bar3{0%,100%{height:6px}50%{height:16px}}
    @keyframes bar4{0%,100%{height:12px}50%{height:4px}}
    @keyframes bar5{0%,100%{height:10px}50%{height:20px}}
    .bar-anim .b1{animation:bar1 .8s ease-in-out infinite}
    .bar-anim .b2{animation:bar2 .9s ease-in-out infinite .1s}
    .bar-anim .b3{animation:bar3 .7s ease-in-out infinite .2s}
    .bar-anim .b4{animation:bar4 1s ease-in-out infinite .05s}
    .bar-anim .b5{animation:bar5 .85s ease-in-out infinite .15s}
  </style>
</head>

<body class="bg-[#f4f3ee] dark:bg-[#1a1a18] text-[#1e1e1c] dark:text-[#e8e5e0] h-screen flex flex-col overflow-hidden transition-colors duration-200"
  style="--b:#d8d2c8">
<script>document.documentElement.style.setProperty('--b', getComputedStyle(document.documentElement).getPropertyValue('--b'))</script>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="h-13 shrink-0 border-b border-[#d8d2c8] dark:border-[#3a3835] bg-[#f4f3ee] dark:bg-[#1a1a18] flex items-center px-4 gap-3 z-30" style="height:52px">
  <a href="index.html" class="text-[11px] text-[#8a8070] hover:text-[#c15f3c] transition-colors shrink-0">← History</a>
  <div class="w-px h-4 bg-[#d8d2c8] dark:bg-[#3a3835]"></div>
  <div class="flex items-center gap-2.5 min-w-0">
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="w-2 h-2 rounded-full bg-red-500 livepulse"></div>
      <span class="text-[10px] font-bold uppercase tracking-wider text-red-500">Live</span>
    </div>
    <span class="font-semibold text-sm">חדר טראומה 1</span>
    <span class="text-[10px] text-[#8a8070] dark:text-[#a8a29e]">#2024-1847</span>
  </div>
  <div class="flex-1"></div>
  <div class="hidden sm:flex items-center gap-3">
    <div class="text-center">
      <div id="wall-clock" class="text-xs font-mono font-medium tabular-nums"></div>
      <div class="text-[8px] text-[#8a8070] uppercase tracking-wide">Clock</div>
    </div>
    <div class="text-center">
      <div id="elapsed-time" class="text-base font-mono font-bold tabular-nums">00:00</div>
      <div class="text-[8px] text-[#8a8070] uppercase tracking-wide">Elapsed</div>
    </div>
  </div>
  <div class="w-px h-4 bg-[#d8d2c8] dark:bg-[#3a3835]"></div>
  <button id="sim-btn" onclick="startSimulation()"
    class="px-3 py-1.5 bg-[#c15f3c] hover:bg-[#a04e31] text-white text-[11px] font-semibold rounded-lg transition-colors shrink-0">
    ▶ Simulate
  </button>
  <button onclick="toggleDark()"
    class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-[#d8d2c8] dark:hover:bg-[#3a3835] transition-colors text-sm shrink-0">
    <span id="theme-icon">🌙</span>
  </button>
</header>

<!-- ═══════════════════ PANELS ═══════════════════ -->
<div class="flex flex-1 min-h-0 overflow-hidden" id="panels-row">

  <!-- ── PANEL 1: Protocol / ACLS Flowchart ── -->
  <div class="panel" id="panel-left">
    <div class="panel-header bg-[#ece9e1] dark:bg-[#222220] border-[#d8d2c8] dark:border-[#3a3835]">
      <div class="panel-header-content flex items-center gap-2 flex-1 min-w-0">
        <span class="text-[9px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold shrink-0">Protocol</span>
        <span id="proto-name" class="text-xs font-semibold truncate">ACLS — Adult CPR</span>
        <div id="proto-trigger-badge" class="hidden text-[9px] px-1.5 py-0.5 rounded bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 shrink-0">Auto</div>
      </div>
      <div class="panel-min-label" onclick="togglePanel('left')">Protocol</div>
      <button onclick="togglePanel('left')" class="panel-min-btn text-[#8a8070] hover:text-[#c15f3c] transition-colors text-lg leading-none shrink-0" title="Minimize">⟨</button>
    </div>
    <div class="panel-body overflow-y-auto bg-[#ece9e1] dark:bg-[#222220] p-3 border-r border-[#d8d2c8] dark:border-[#3a3835]" id="protocol-body">
      <!-- Flowchart injected here -->
    </div>
  </div>

  <!-- ── PANEL 2: Transcript ── -->
  <div class="panel" id="panel-center">
    <div class="panel-header bg-[#f4f3ee] dark:bg-[#1a1a18] border-[#d8d2c8] dark:border-[#3a3835]">
      <div class="panel-header-content flex items-center gap-3 flex-1 min-w-0">
        <span class="font-semibold text-sm shrink-0">Transcript</span>
        <div class="flex items-center gap-2.5 flex-1 min-w-0 overflow-x-auto" id="speaker-legend"></div>
        <button onclick="toggleTimeMode()"
          class="text-[10px] px-2 py-0.5 rounded-full border border-[#d8d2c8] dark:border-[#3a3835] text-[#8a8070] hover:border-[#c15f3c] hover:text-[#c15f3c] transition-colors shrink-0 tabular-nums whitespace-nowrap">
          <span id="time-mode-lbl">Absolute</span>
        </button>
      </div>
      <div class="panel-min-label" onclick="togglePanel('center')">Transcript</div>
      <button onclick="togglePanel('center')" class="panel-min-btn text-[#8a8070] hover:text-[#c15f3c] transition-colors text-lg leading-none shrink-0" title="Minimize">⟨</button>
    </div>
    <div class="panel-body flex flex-col min-h-0">
      <div id="transcript-feed" class="flex-1 overflow-y-auto px-4 py-3 space-y-1">
        <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center select-none py-12">
          <div class="text-4xl mb-3 opacity-25">🎙</div>
          <div class="text-sm text-[#8a8070]">Waiting for audio…</div>
          <div class="text-xs text-[#a8a29e] mt-1">Press Simulate to run demo</div>
        </div>
      </div>
      <div class="border-t border-[#d8d2c8] dark:border-[#3a3835] px-4 py-2 flex items-center gap-2.5 shrink-0">
        <div id="audio-bars" class="flex items-end gap-0.5 h-5">
          <div class="b1 w-1 bg-[#c15f3c] rounded-full opacity-40" style="height:8px"></div>
          <div class="b2 w-1 bg-[#c15f3c] rounded-full opacity-40" style="height:14px"></div>
          <div class="b3 w-1 bg-[#c15f3c] rounded-full opacity-40" style="height:6px"></div>
          <div class="b4 w-1 bg-[#c15f3c] rounded-full opacity-40" style="height:12px"></div>
          <div class="b5 w-1 bg-[#c15f3c] rounded-full opacity-40" style="height:10px"></div>
        </div>
        <span id="soniox-status" class="text-[10px] text-[#8a8070]">SONIOX — Idle</span>
        <span class="ml-auto text-[10px] text-[#8a8070] tabular-nums" id="entry-count">0 entries</span>
      </div>
    </div>
  </div>

  <!-- ── PANEL 3: MoH Summary ── -->
  <div class="panel" id="panel-right">
    <div class="panel-header bg-[#ece9e1] dark:bg-[#222220] border-[#d8d2c8] dark:border-[#3a3835]">
      <div class="panel-header-content flex items-center gap-2 flex-1 min-w-0">
        <div class="min-w-0">
          <div class="text-[9px] text-[#8a8070] dark:text-[#a8a29e] uppercase tracking-widest leading-tight">משרד הבריאות</div>
          <div class="text-xs font-semibold leading-tight">טופס רישום ומוניטורינג החייאה</div>
        </div>
        <div id="sum-badge" class="ml-auto text-[9px] px-2 py-0.5 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400 font-medium shrink-0">Draft</div>
      </div>
      <div class="panel-min-label" onclick="togglePanel('right')">Summary</div>
      <button onclick="togglePanel('right')" class="panel-min-btn text-[#8a8070] hover:text-[#c15f3c] transition-colors text-lg leading-none shrink-0 ml-1" title="Minimize">⟩</button>
    </div>
    <div class="panel-body flex flex-col min-h-0 bg-[#ece9e1] dark:bg-[#222220]">
      <div id="moh-form" class="flex-1 overflow-y-auto p-3 border-l border-[#d8d2c8] dark:border-[#3a3835]"></div>
      <div class="border-t border-l border-[#d8d2c8] dark:border-[#3a3835] p-3 shrink-0">
        <div id="sign-area">
          <input id="signer-name" type="text" placeholder="שם הסגן / Charge Nurse" class="si w-full mb-2"/>
          <button onclick="signForm()"
            class="w-full py-2 bg-[#c15f3c] hover:bg-[#a04e31] text-white text-[11px] font-semibold rounded-lg transition-colors flex items-center justify-center gap-1.5">
            ✍️ Sign &amp; Finalize / חתום ואשר
          </button>
        </div>
        <div id="signed-area" class="hidden text-center py-1">
          <div class="text-green-600 dark:text-green-400 font-semibold text-sm">✓ נחתם ואושר</div>
          <div id="signed-info" class="text-[9px] text-[#8a8070] mt-1"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ═══════════════════ TIMERS ═══════════════════ -->
<div id="timer-container" class="fixed top-14 right-4 z-50 flex flex-col gap-2 pointer-events-none" style="width:236px"></div>

<!-- ═══════════════════ SCRIPT ══════════════════ -->
<script>
// ─── CSS VAR SYNC ────────────────────────────────────────────────────────────
function syncCssVars(){
  const d = document.documentElement;
  d.style.setProperty('--b', S.dark ? '#3a3835' : '#d8d2c8');
}

// ─── DATA ────────────────────────────────────────────────────────────────────
const SPEAKERS=[
  {name:'Dr. Cohen',   role:'Trauma Lead',    color:'#3b82f6'},
  {name:'Nurse Levi',  role:'Charge Nurse',   color:'#10b981'},
  {name:'Nurse Katz',  role:'Med Nurse',      color:'#8b5cf6'},
  {name:'Paramedic Ben',role:'Paramedic',     color:'#f59e0b'},
  {name:'Dr. Stern',   role:'Anesthesiology', color:'#ec4899'},
];

const TRANSCRIPT=[
  {t:2, s:3, text:'פציינט מגיע — גבר, 45, פגיעת ראש חמורה, ללא דופק בהגעה. זמן פגיעה משוער 18:32.'},
  {t:5, s:0, text:'מתחילים החייאה — CPR! כולם לתפקידים.'},
  {t:10,s:1, text:'לחיצות חזה בביצוע, קצב 110 לדקה.'},
  {t:15,s:4, text:'מחבר מוניטור. קצב VF — פיברילציה חדרית.'},
  {t:21,s:0, text:'הכינו לדפיברילציה. כולם מתרחקים!'},
  {t:26,s:2, text:'אדרנלין 1 מ"ג ניתן תוך-ורידי.'},
  {t:31,s:0, text:'דפיברילציה 200 ג\'אול — פרוק!'},
  {t:36,s:1, text:'ממשיכים CPR. אין שינוי בקצב.'},
  {t:44,s:4, text:'מכין לאינטובציה. לרינגוסקופ מוכן.'},
  {t:50,s:4, text:'Intubating — צינור 8.0, עומק 22 ס"מ. מאושר.'},
  {t:58,s:2, text:'אדרנלין שני ניתן — 1 מ"ג תוך-ורידי.'},
  {t:64,s:0, text:'דפיברילציה שנייה 360 ג\'אול.'},
  {t:71,s:1, text:'יש קצב סינוס! דופק מורגש בקרוטיד.'},
  {t:75,s:0, text:'ROSC — חזרת מחזור ספונטני. מעבירים לניטור רציף.'},
  {t:81,s:4, text:'לחץ דם 90/60 ממ"כ. SpO2 94%. מתייצב.'},
  {t:87,s:3, text:'הפציינט מועבר ל-ICU בניטור מלא.'},
  {t:93,s:0, text:'משך האירוע כ-12 דקות. נדרש תיעוד ואישור.'},
];

const KW={
  'החייאה':{type:'protocol'},
  'CPR':{type:'protocol'},
  'אדרנלין':{type:'timer',label:'Adrenaline — Next dose',sec:240},
  'Intubating':{type:'timer',label:'Intubation attempt',sec:30},
  'intubating':{type:'timer',label:'Intubation attempt',sec:30},
};

// ACLS flowchart nodes
const FLOW_NODES=[
  {id:'f0',type:'start', en:'Unresponsive / No Breathing',            he:'ללא הכרה / ללא נשימה',       done:false},
  {id:'f1',type:'action',en:'Activate Emergency Response · Call Team', he:'הפעל מערך חירום — קרא לצוות',done:false,time:true},
  {id:'f2',type:'action',en:'Start CPR 100–120/min · Attach Monitor/Defib',he:'לחיצות חזה 100–120/דקה · חבר מוניטור',done:false,time:true},
  {id:'f3',type:'decision',en:'Shockable Rhythm?',                     he:'קצב ניתן להדפה?',             done:false},
  // shockable branch
  {id:'f4a',type:'shock', en:'⚡ SHOCK · Defibrillate',               he:'דפיברילציה',                  done:false,branch:'left',branchLabel:'VF / pVT',time:true,inputLabel:'Joules'},
  {id:'f5a',type:'action',en:'CPR 2 min · IV/IO · Epinephrine',       he:'לחיצות 2 דק · עירוי · אדרנלין',done:false,branch:'left',time:true},
  // non-shockable branch
  {id:'f4b',type:'action',en:'CPR 2 min · IV/IO · Epinephrine q3-5min',he:'לחיצות 2 דק · אדרנלין כל 3-5 דקות',done:false,branch:'right',branchLabel:'PEA / Asystole',time:true},
  {id:'f5b',type:'action',en:'Treat Reversible Causes (H\'s & T\'s)', he:'טפל בגורמים הפיכים (H ו-T)',  done:false,branch:'right'},
  // outcome
  {id:'f6', type:'reassess',en:'↺ Reassess Rhythm every 2 min',      he:'הערכת קצב מחדש כל 2 דקות',   done:false},
  {id:'f7', type:'end',    en:'ROSC → Post-Cardiac Arrest Care',      he:'חזרת מחזור ← טיפול פוסט-החייאה',done:false},
];

// ─── STATE ────────────────────────────────────────────────────────────────────
const S={
  dark:false, timeMode:'absolute',
  wallStart:null, entries:[], simIdx:0, simRunning:false,
  timers:{}, timerSeq:0, elapsedTick:null,
  panels:{left:true, center:true, right:true},
  meds:{adr:0,atr:0,ami:0,lid:0,mid:0,bic:0,mag:0,flu:0,nal:0,dop:0},
  interventions:{cpr:false,defib:0,intub:false},
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init(){
  syncCssVars();
  renderLegend();
  renderFlowchart();
  buildMoHForm();
  tickClock();
  setInterval(tickClock,1000);
}

// ─── CLOCK ────────────────────────────────────────────────────────────────────
function tickClock(){
  document.getElementById('wall-clock').textContent=
    new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function tickElapsed(){
  if(!S.wallStart)return;
  const sec=Math.floor((Date.now()-S.wallStart)/1000);
  document.getElementById('elapsed-time').textContent=
    String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}

// ─── THEME ────────────────────────────────────────────────────────────────────
function toggleDark(){
  S.dark=!S.dark;
  document.documentElement.classList.toggle('dark',S.dark);
  document.getElementById('theme-icon').textContent=S.dark?'☀️':'🌙';
  syncCssVars();
}

// ─── LEGEND ───────────────────────────────────────────────────────────────────
function renderLegend(){

function togglePanel(side){

  panel.classList.toggle('minimized',!S.panels[side]);
  // flip arrow on minimize button

    else btn.textContent=S.panels[side]?'⟨':'⟩';

// ─── FLOWCHART ────────────────────────────────────────────────────────────────
function renderFlowchart(){
  const body=document.getElementById('protocol-body');
  let html='<div class="space-y-1">';

  // group branches
  const topNodes=FLOW_NODES.filter(n=>!n.branch);
  // find branched nodes
  const leftBranch=FLOW_NODES.filter(n=>n.branch==='left');
  const rightBranch=FLOW_NODES.filter(n=>n.branch==='right');

  // render top until decision
  for(const n of topNodes){
    if(n.id==='f6'){
      // insert branches before reassess
      html+=`<div class="fn-branch-wrap">`;
      html+=`<div>`;
      for(const ln of leftBranch){
        if(ln.branchLabel) html+=`<div class="fn-branch-label text-red-500 dark:text-red-400">${ln.branchLabel}</div>`;
        html+=renderNode(ln);
        html+=`<div class="fn-arrow">↓</div>`;
      }
      html+=`</div>`;
      html+=`<div>`;
      for(const rn of rightBranch){
        if(rn.branchLabel) html+=`<div class="fn-branch-label text-slate-500 dark:text-slate-400">${rn.branchLabel}</div>`;
        html+=renderNode(rn);
        html+=`<div class="fn-arrow">↓</div>`;
      }
      html+=`</div>`;
      html+=`</div>`;
      html+=`<div class="text-center text-[10px] text-[#8a8070] py-1 font-medium">↑ Reassess every 2 min / הערכה כל 2 דקות ↑</div>`;
    }
    html+=renderNode(n);
    if(n.id!=='f7') html+=`<div class="fn-arrow">↓</div>`;
  }
  html+='</div>';
  body.innerHTML=html;
}

function renderNode(n){
  const typeClass=n.type==='start'||n.type==='end'?'fn-start'+(n.type==='end'?' fn-end':''):
    n.type==='decision'?'fn-decision':
    n.type==='shock'?'fn-shock':'fn-action';
  const doneClass=n.done?' done':'';
  const inputHtml=n.inputLabel?
    `<input type="text" placeholder="${n.inputLabel}" onclick="event.stopPropagation()"
      class="si w-full mt-1.5" style="font-size:10px;padding:2px 5px" id="fi-${n.id}"/>`:'';
  const timeHtml=n.time&&n.done?
    `<div class="text-[9px] mt-1 opacity-60" id="ft-${n.id}"></div>`:'';

  return `<div class="fn-node ${typeClass}${doneClass}" onclick="toggleFlowNode('${n.id}')" id="fn-${n.id}">
    <div class="text-[11px] font-medium leading-tight">${n.en}</div>
    <div class="text-[9px] opacity-70 mt-0.5 leading-tight" dir="rtl">${n.he}</div>
    ${inputHtml}${timeHtml}
  </div>`;
}

function toggleFlowNode(id){
  const n=FLOW_NODES.find(x=>x.id===id);
  if(!n)return;
  n.done=!n.done;
  const el=document.getElementById('fn-'+id);
  if(!el)return;
  if(n.done){
    el.classList.add('done');
    // record time
    const t=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    let tEl=document.getElementById('ft-'+id);
    if(!tEl&&n.time){
      const d=document.createElement('div');
      d.className='text-[9px] mt-1 opacity-60';
      d.id='ft-'+id;
      el.appendChild(d);
      tEl=d;
    }
    if(tEl) tEl.textContent=`✓ ${t}`;
  } else {
    el.classList.remove('done');
    const tEl=document.getElementById('ft-'+id);
    if(tEl) tEl.remove();
  }
}

function activateFlowNode(id){
  const el=document.getElementById('fn-'+id);
  if(el) el.classList.add('active');
}

// ─── SIMULATION ───────────────────────────────────────────────────────────────
function startSimulation(){
  if(S.simRunning)return;
  S.simRunning=true;
  S.wallStart=Date.now();
  S.simIdx=0;
  const btn=document.getElementById('sim-btn');
  btn.textContent='⏺ Live';
  btn.disabled=true;
  btn.classList.add('opacity-60','cursor-not-allowed');
  document.getElementById('soniox-status').textContent='SONIOX — Connected ●';
  document.getElementById('audio-bars').classList.add('bar-anim');
  const e=document.getElementById('empty-state');
  if(e)e.remove();
  S.elapsedTick=setInterval(tickElapsed,1000);
  scheduleNext();
}

function scheduleNext(){
  if(S.simIdx>=TRANSCRIPT.length){
    document.getElementById('soniox-status').textContent='SONIOX — Complete';
    document.getElementById('audio-bars').classList.remove('bar-anim');
    clearInterval(S.elapsedTick);
    return;
  }
  const cur=TRANSCRIPT[S.simIdx],prev=S.simIdx>0?TRANSCRIPT[S.simIdx-1]:{t:0};
  setTimeout(()=>{ingestEntry(cur);S.simIdx++;scheduleNext();},Math.max(300,(cur.t-prev.t)*850));
}

function ingestEntry(raw){
  const wallTime=new Date(S.wallStart+raw.t*850);
  const entry={...raw,wallTime};
  S.entries.push(entry);
  checkKW(raw.text);
  renderEntry(entry,S.entries.length-1);
  pushFormUpdate(raw);
  document.getElementById('entry-count').textContent=`${S.entries.length} entries`;
  const feed=document.getElementById('transcript-feed');
  feed.scrollTop=feed.scrollHeight;
}

function renderEntry(entry,idx){
  const sp=SPEAKERS[entry.s];
  const feed=document.getElementById('transcript-feed');
  const wallStr=entry.wallTime.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const relStr='T+'+String(Math.floor(entry.t/60)).padStart(2,'0')+':'+String(entry.t%60).padStart(2,'0');
  const row=document.createElement('div');
  row.className='t-entry entry-new flex gap-2.5 py-1.5 px-2 rounded-lg hover:bg-black/[.04] dark:hover:bg-white/[.04] transition-colors';
  row.style.setProperty('--sc',sp.color);
  row.dataset.idx=idx;
  row.innerHTML=`
    <button class="ts-btn text-[9px] font-mono tabular-nums text-[#8a8070] hover:text-[#c15f3c] min-w-[3.4rem] text-left leading-tight transition-colors pt-0.5 shrink-0" onclick="toggleTimeMode()">
      <span class="ts-abs">${wallStr}</span><span class="ts-rel hidden">${relStr}</span>
    </button>
    <div class="flex-1 min-w-0">
      <div class="flex items-baseline gap-1.5 mb-0.5">
        <span class="text-[10px] font-semibold" style="color:${sp.color}">${sp.name}</span>
        <span class="text-[8px] text-[#8a8070]">${sp.role}</span>
      </div>
      <div class="text-sm leading-relaxed" dir="rtl">${hlKW(entry.text)}</div>
    </div>`;
  feed.appendChild(row);
}

function hlKW(text){
  let t=esc(text);
  Object.keys(KW).forEach(kw=>{
    const cls=KW[kw].type==='protocol'?'kw-protocol':'kw-timer';
    t=t.replace(new RegExp(`(${escRe(kw)})`,'g'),`<span class="${cls}">$1</span>`);
  });
  return t;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

// ─── TIME MODE ────────────────────────────────────────────────────────────────
function toggleTimeMode(){
  S.timeMode=S.timeMode==='absolute'?'relative':'absolute';
  const abs=S.timeMode==='absolute';
  document.getElementById('time-mode-lbl').textContent=abs?'Absolute':'Relative';
  document.querySelectorAll('.ts-abs').forEach(el=>el.classList.toggle('hidden',!abs));
  document.querySelectorAll('.ts-rel').forEach(el=>el.classList.toggle('hidden',abs));
}

// ─── KEYWORDS ────────────────────────────────────────────────────────────────
function checkKW(text){
  Object.entries(KW).forEach(([kw,a])=>{
    if(text.includes(kw)){
      if(a.type==='protocol') autoActivateProtocol(kw);
      if(a.type==='timer') spawnTimer(a.label,a.sec,kw);
    }
  });
}

function autoActivateProtocol(trigger){
  document.getElementById('proto-trigger-badge').classList.remove('hidden');
  // Open left panel if minimized
  if(!S.panels.left) togglePanel('left');
}

// ─── TIMERS ───────────────────────────────────────────────────────────────────
function spawnTimer(label,sec,trigger){
  const id=++S.timerSeq;
  const end=Date.now()+sec*1000;
  S.timers[id]={label,end,total:sec,trigger};
  renderTimer(id);
  S.timers[id].tick=setInterval(()=>tickTimer(id),250);
}

function renderTimer(id){
  const t=S.timers[id];
  const card=document.createElement('div');
  card.id='tc-'+id;
  card.className='timer-card pointer-events-auto bg-[#f4f3ee] dark:bg-[#252529] border border-[#d8d2c8] dark:border-[#3a3835] rounded-xl p-3 shadow-xl';
  card.innerHTML=`
    <div class="flex items-start justify-between mb-2">
      <div>
        <div class="text-[8px] text-[#8a8070] uppercase tracking-wider">Next reminder</div>
        <div class="text-xs font-semibold">${t.label}</div>
      </div>
      <button onclick="killTimer(${id})" class="text-[#8a8070] hover:text-red-500 transition-colors leading-none ml-2 text-sm">✕</button>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex-1 h-1.5 bg-[#d8d2c8] dark:bg-[#3a3835] rounded-full overflow-hidden">
        <div id="tb-${id}" class="h-full bg-[#c15f3c] rounded-full" style="width:100%"></div>
      </div>
      <div id="td-${id}" class="text-sm font-mono font-bold tabular-nums text-[#c15f3c] min-w-[2.6rem] text-right"></div>
    </div>
    <div class="text-[8px] text-[#8a8070] mt-1.5">Triggered: "${t.trigger}"</div>`;
  document.getElementById('timer-container').prepend(card);
  tickTimer(id);
}

function tickTimer(id){
  const t=S.timers[id];if(!t)return;
  const rem=Math.ceil((t.end-Date.now())/1000);
  const td=document.getElementById('td-'+id);
  const tb=document.getElementById('tb-'+id);
  if(!td)return;
  const safe=Math.max(0,rem);
  td.textContent=String(Math.floor(safe/60)).padStart(2,'0')+':'+String(safe%60).padStart(2,'0');
  const pct=Math.max(0,(rem/t.total)*100);
  if(tb){tb.style.width=pct+'%';if(pct<25){tb.style.background='#ef4444';td.style.color='#ef4444';}}
  if(rem<=0){clearInterval(t.tick);timerDone(id);}
}

function timerDone(id){
  const card=document.getElementById('tc-'+id);
  if(card)card.style.boxShadow='0 0 0 2px #ef4444';
  playBell();
}

function killTimer(id){
  if(S.timers[id]?.tick)clearInterval(S.timers[id].tick);
  delete S.timers[id];
  const c=document.getElementById('tc-'+id);
  if(c){c.style.transition='opacity .2s,transform .2s';c.style.opacity='0';c.style.transform='translateX(110%)';setTimeout(()=>c.remove(),220);}
}

function playBell(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[880,.3],[1760,.15],[2640,.08]].forEach(([f,g],i)=>{
      const o=ctx.createOscillator(),gn=ctx.createGain();
      o.connect(gn);gn.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      gn.gain.setValueAtTime(g,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+2.5);
      o.start(ctx.currentTime+i*.04);o.stop(ctx.currentTime+2.5);
    });
  }catch(e){}
}

      <label class="cb-row"><input type="radio" name="transfer-state" value="other"/> אחר</label>
    </div>
    <div class="grid grid-cols-2 gap-1.5">
      <div><div class="text-[9px] text-[#8a8070] mb-0.5">הרבעה ל / Transfer to</div><input id="m-transfer-to" class="si w-full" placeholder="ICU / OR…"/></div>
      <div><div class="text-[9px] text-[#8a8070] mb-0.5">שעת הרבעה / Time</div><input id="m-transfer-t" class="si w-full" placeholder="HH:MM"/></div>
    </div>
  </div>

  <!-- 12. Team -->
  <div class="f-section">
    <div class="f-label">אנשי הצוות — Team Members</div>
    <div class="space-y-1.5">
      <div><div class="text-[9px] text-[#8a8070] mb-0.5">1 — מנהל ההחייאה / CPR Leader</div><input id="m-t1" class="si w-full" value="Dr. Cohen — Trauma Lead"/></div>
      <div><div class="text-[9px] text-[#8a8070] mb-0.5">2 — איש צוות / Team member</div><input id="m-t2" class="si w-full" value="Nurse Levi — Charge Nurse"/></div>
      <div><div class="text-[9px] text-[#8a8070] mb-0.5">3 — איש צוות / Team member</div><input id="m-t3" class="si w-full" value="Dr. Stern — Anesthesiology"/></div>
    </div>
  </div>

  <!-- Incident notes -->
  <div class="f-section">
    <div class="f-label">הערות / Notes</div>
    <textarea id="m-notes" rows="3" class="si w-full resize-none" placeholder="הערות נוספות…"></textarea>
  </div>

  </div>`;
}

// ─── FORM AUTO-FILL ───────────────────────────────────────────────────────────
let defibCount=0,adrCount=0,intvCount=0;

function pushFormUpdate(raw){
  const t=raw.text;
  const wallTime=new Date(S.wallStart+raw.t*850).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});

  if(/(CPR|החייאה)/.test(t)&&!S.interventions.cpr){
    S.interventions.cpr=true;
    setFormVal('act-cpr',true);
    setFormVal('act-cpr-t',wallTime);
    setFormVal('m-t-cpr',wallTime);
  }
  if(/מוניטור/.test(t)){ setFormVal('act-monitor',true); setFormVal('act-monitor-t',wallTime); }
  if(/דופק/.test(t)){ setFormVal('act-pulse',true); setFormVal('act-pulse-t',wallTime); }
  if(/דפיברילציה/.test(t)){
    defibCount++;
    setFormVal('act-defib',true); setFormVal('act-defib-t',wallTime);
    addDefibRow(wallTime);
  }
  if(/אדרנלין/.test(t)){
    adrCount++;
    const dEl=document.getElementById('m-adr-dose');
    const tEl=document.getElementById('m-adr-time');
    if(dEl&&!dEl.value) dEl.value='1 mg IV';
    // log each dose
    const noteEl=document.getElementById('m-notes');
    if(noteEl) noteEl.value=(noteEl.value?noteEl.value+'\n':'')+`Adrenaline dose ${adrCount} — ${wallTime}`;
  }
  if(/אינטובציה|Intubating/i.test(t)&&!S.interventions.intub){
    S.interventions.intub=true;
    setFormVal('act-intub',true); setFormVal('act-intub-t',wallTime);
  }
  if(/ROSC|חזרת מחזור/.test(t)){
    setFormVal('m-end',wallTime);
    const r=document.querySelector('input[name="end-breath"][value="yes"]');
    if(r)r.checked=true;
    const r2=document.querySelector('input[name="transfer-state"][value="unconscious"]');
    if(r2)r2.checked=true;
  }
  if(/90\/60|SpO2/.test(t)){
    setFormVal('m-bp','90/60');
    setFormVal('m-spo2','94%');
  }
  if(/מועבר ל-ICU|ICU/.test(t)){
    setFormVal('m-transfer-to','ICU');
    setFormVal('m-transfer-t',wallTime);
  }
}

function setFormVal(id,val){
  const el=document.getElementById(id);
  if(!el)return;
  if(typeof val==='boolean') el.checked=val;
  else el.value=val;
}

function addDefibRow(time){
  const container=document.getElementById('defib-rows');
  if(!container)return;
  if(defibCount===1) container.innerHTML=''; // clear placeholder
  const row=document.createElement('div');
  row.className='grid grid-cols-[auto_1fr_1fr] gap-1.5 items-center text-[10px]';
  row.innerHTML=`
    <span class="font-semibold text-[#c15f3c]">#${defibCount}</span>
    <input class="si" value="${time}" placeholder="HH:MM" style="font-size:10px;padding:2px 5px"/>
    <input class="si" placeholder="J" style="font-size:10px;padding:2px 5px"/>`;
  container.appendChild(row);
}

// ─── SIGN ─────────────────────────────────────────────────────────────────────
function signForm(){
  const name=document.getElementById('signer-name').value.trim();
  if(!name){
    const inp=document.getElementById('signer-name');
    inp.style.borderColor='#ef4444';inp.focus();
    setTimeout(()=>inp.style.borderColor='',1500);return;
  }
  const ts=new Date().toLocaleString('he-IL');
  document.getElementById('sign-area').classList.add('hidden');
  document.getElementById('signed-area').classList.remove('hidden');
  document.getElementById('signed-info').textContent=`${name} · ${ts}`;
  document.getElementById('sum-badge').textContent='✓ נחתם';
  document.getElementById('sum-badge').className='text-[9px] px-2 py-0.5 rounded-full bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 font-medium';
  document.querySelectorAll('#moh-form .si').forEach(el=>el.setAttribute('readonly',''));
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',init);
</script>
