<!DOCTYPE html>
<html lang="he" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedScript — History</title>
  <script>tailwind={config:{darkMode:'class'}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#d1c5b8;border-radius:3px}
    .dark ::-webkit-scrollbar-thumb{background:#52525b}

    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .35s ease-out both}
    .fade-up:nth-child(1){animation-delay:.04s}
    .fade-up:nth-child(2){animation-delay:.08s}
    .fade-up:nth-child(3){animation-delay:.12s}
    .fade-up:nth-child(4){animation-delay:.16s}
    .fade-up:nth-child(5){animation-delay:.20s}
    .fade-up:nth-child(6){animation-delay:.24s}

    #modal-overlay{transition:opacity .2s}
    #modal-box{transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .25s}
  </style>
</head>

<body class="bg-[#f4f3ee] dark:bg-[#1a1a18] text-[#1e1e1c] dark:text-[#e8e5e0] min-h-screen transition-colors duration-200">

<header class="h-14 border-b border-[#d8d2c8] dark:border-[#3a3835] bg-[#f4f3ee] dark:bg-[#1a1a18] sticky top-0 z-20 flex items-center px-6 gap-4">
  <div class="flex items-center gap-2">
    <div class="w-7 h-7 rounded-lg bg-[#c15f3c] flex items-center justify-center text-white text-sm font-bold">M</div>
    <span class="font-semibold text-base">MedScript</span>
    <span class="text-xs text-[#8a8070] dark:text-[#a8a29e] hidden sm:block">מערכת תעתוק טראומה</span>
  </div>
  <div class="flex-1"></div>
  <div class="hidden sm:flex items-center gap-3">
    <div class="text-xs px-3 py-1 rounded-full bg-yellow-50 dark:bg-yellow-900/20 text-yellow-700 dark:text-yellow-400">
      Unsigned: <span class="font-semibold" id="stat-unsigned-n">0</span>
    </div>
  </div>
  <a href="room.html" class="px-4 py-1.5 bg-[#c15f3c] hover:bg-[#a04e31] text-white text-xs font-semibold rounded-lg transition-colors flex items-center gap-1.5">
    + New Session
  </a>
  <button onclick="toggleDark()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-[#d8d2c8] dark:hover:bg-[#3a3835] transition-colors text-base">
    <span id="theme-icon">🌙</span>
  </button>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">
  <div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
    <div>
      <h1 class="text-xl font-bold">Incident History</h1>
      <p class="text-sm text-[#8a8070] dark:text-[#a8a29e] mt-0.5">היסטוריית אירועים — טראומה</p>
    </div>
    <div class="flex items-center gap-2">
      <input id="search-input" type="text" placeholder="Search…" oninput="filterRows()"
        class="px-3 py-1.5 text-xs border border-[#d8d2c8] dark:border-[#3a3835] rounded-lg bg-white dark:bg-[#252420] outline-none focus:ring-2 focus:ring-[#c15f3c] w-40 transition-shadow text-[#1e1e1c] dark:text-[#e8e5e0]"/>
      <select id="filter-status" onchange="filterRows()"
        class="px-3 py-1.5 text-xs border border-[#d8d2c8] dark:border-[#3a3835] rounded-lg bg-white dark:bg-[#252420] outline-none focus:ring-2 focus:ring-[#c15f3c] transition-shadow text-[#1e1e1c] dark:text-[#e8e5e0]">
        <option value="">All status</option>
        <option value="signed">Signed</option>
        <option value="draft">Draft</option>
      </select>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8" id="stat-cards"></div>

  <!-- Table -->
  <div class="bg-white dark:bg-[#222220] border border-[#d8d2c8] dark:border-[#3a3835] rounded-2xl overflow-hidden shadow-sm">
    <div class="grid grid-cols-[1fr_1fr_1fr_80px_108px_72px] px-5 py-3 border-b border-[#d8d2c8] dark:border-[#3a3835] bg-[#f5f1ec] dark:bg-[#252528]">
      <div class="text-[10px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold">Date / תאריך</div>
      <div class="text-[10px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold">Incident ID</div>
      <div class="text-[10px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold">Trauma Type</div>
      <div class="text-[10px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold">Duration</div>
      <div class="text-[10px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold">Status</div>
      <div class="text-[10px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold">Action</div>
    </div>
    <div id="incident-list"></div>
    <div id="no-results" class="hidden text-center py-10 text-sm text-[#8a8070] dark:text-[#a8a29e]">No results found</div>
  </div>
</main>

<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 flex items-center justify-center p-4">
  <div id="modal-box" class="bg-white dark:bg-[#222220] rounded-2xl border border-[#d8d2c8] dark:border-[#3a3835] shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col opacity-0 scale-95">
    <div class="flex items-start justify-between p-5 border-b border-[#d8d2c8] dark:border-[#3a3835]">
      <div>
        <div class="text-[9px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] mb-1">Incident Report</div>
        <div id="modal-title" class="font-bold text-base"></div>
        <div id="modal-sub" class="text-xs text-[#8a8070] dark:text-[#a8a29e] mt-0.5"></div>
      </div>
      <button onclick="closeModal()" class="text-[#8a8070] hover:text-red-500 transition-colors text-xl ml-4 leading-none">✕</button>
    </div>
    <div class="overflow-y-auto flex-1 p-5" id="modal-body"></div>
    <div class="p-4 border-t border-[#d8d2c8] dark:border-[#3a3835] flex items-center justify-between gap-3">
      <div id="modal-signed" class="text-xs text-[#8a8070] dark:text-[#a8a29e]"></div>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="px-4 py-1.5 text-xs border border-[#d8d2c8] dark:border-[#3a3835] rounded-lg hover:bg-[#ece9e1] dark:hover:bg-[#252420] transition-colors">Close</button>
        <a href="room.html" class="px-4 py-1.5 text-xs bg-[#c15f3c] hover:bg-[#a04e31] text-white rounded-lg transition-colors">Open Room</a>
      </div>
    </div>
  </div>
</div>

<script>
const INCIDENTS = [
  {
    id:'2024-1847', date:'2024-05-17', time:'18:34', typeEn:'Cardiac Arrest', typeHe:'דום לב',
    duration:'12 min', status:'signed', nurse:'Nurse Levi',
    interventions:['CPR initiated','Defibrillation ×2','ET Intubation (tube 8.0)'],
    meds:['Epinephrine 1mg IV ×2'],
    outcome:'ROSC achieved after 12 minutes. Sinus rhythm. Transferred to ICU.',
    snippet:[
      {s:'Dr. Cohen', c:'#3b82f6', text:'מתחילים החייאה — CPR! כולם לתפקידים.'},
      {s:'Nurse Katz', c:'#8b5cf6', text:'אדרנלין 1 מ"ג ניתן תוך-ורידי.'},
      {s:'Dr. Stern', c:'#ec4899', text:'Intubating — צינור 8.0, עומק 22 ס"מ.'},
      {s:'Nurse Levi', c:'#10b981', text:'יש קצב סינוס! דופק מורגש בקרוטיד.'},
      {s:'Dr. Cohen', c:'#3b82f6', text:'ROSC — חזרת מחזור ספונטני.'},
    ]
  },
  {
    id:'2024-1831', date:'2024-05-17', time:'14:12', typeEn:'Major Trauma', typeHe:'טראומה קשה',
    duration:'28 min', status:'draft', nurse:'',
    interventions:['Massive transfusion protocol','Emergency laparotomy prep'],
    meds:['TXA 1g IV','FFP 2 units'],
    outcome:'',
    snippet:[
      {s:'Paramedic Ben', c:'#f59e0b', text:'גבר 32, תאונת דרכים, טראומה בטנית וחזה.'},
      {s:'Dr. Cohen', c:'#3b82f6', text:'פותחים פרוטוקול עירוי מסיבי.'},
      {s:'Nurse Levi', c:'#10b981', text:'TXA ניתן. לחץ דם 70/40.'},
    ]
  },
  {
    id:'2024-1809', date:'2024-05-17', time:'09:45', typeEn:'Respiratory Failure', typeHe:'אי ספיקה נשימתית',
    duration:'19 min', status:'signed', nurse:'Dr. Cohen',
    interventions:['RSI Intubation','BiPAP pre-oxygenation'],
    meds:['Ketamine 1.5mg/kg IV','Succinylcholine 1.5mg/kg IV'],
    outcome:'Intubated and sedated. SpO2 96%. Transferred to ICU on ventilator.',
    snippet:[
      {s:'Dr. Stern', c:'#ec4899', text:'SpO2 78%, RR 34. נכשלים ב-BiPAP.'},
      {s:'Dr. Cohen', c:'#3b82f6', text:'RSI — ketamine ו-succinylcholine.'},
      {s:'Dr. Stern', c:'#ec4899', text:'אינטובציה הושלמה. SpO2 96%.'},
    ]
  },
  {
    id:'2024-1792', date:'2024-05-16', time:'22:17', typeEn:'Polytrauma', typeHe:'פוליטראומה',
    duration:'45 min', status:'signed', nurse:'Nurse Katz',
    interventions:['FAST exam','Chest tube (R)','Pelvic binder','2× large-bore IV'],
    meds:['Morphine 4mg IV','TXA 1g IV','Norepinephrine infusion'],
    outcome:'Stabilized. BP 100/65. Transferred to OR for exploratory laparotomy.',
    snippet:[
      {s:'Paramedic Ben', c:'#f59e0b', text:'אישה 28, נפילה מגובה 4 קומות. GCS 10.'},
      {s:'Dr. Cohen', c:'#3b82f6', text:'FAST — נוזל חופשי. נכין לניתוח.'},
      {s:'Dr. Stern', c:'#ec4899', text:'chest tube ימין — 300cc דם.'},
    ]
  },
  {
    id:'2024-1788', date:'2024-05-16', time:'19:03', typeEn:'Cardiac Arrest', typeHe:'דום לב',
    duration:'8 min', status:'draft', nurse:'',
    interventions:['CPR initiated','Defibrillation ×1'],
    meds:['Epinephrine 1mg IV'],
    outcome:'',
    snippet:[
      {s:'Nurse Levi', c:'#10b981', text:'דום לב בהגעה. מתחילים החייאה.'},
      {s:'Dr. Cohen', c:'#3b82f6', text:'VF — דפיברילציה 200 ג\'אול.'},
    ]
  },
  {
    id:'2024-1771', date:'2024-05-16', time:'11:28', typeEn:'Burns', typeHe:'כוויות',
    duration:'34 min', status:'signed', nurse:'Nurse Levi',
    interventions:['Fluid resuscitation (Parkland formula)','Wound cooling','Morphine PCA'],
    meds:['Morphine 6mg IV','LR ~4L/24h'],
    outcome:'Burns 35% BSA. Airway intact. Transferred to burn unit.',
    snippet:[
      {s:'Paramedic Ben', c:'#f59e0b', text:'גבר 52, כוויות 35% BSA, שריפת בית.'},
      {s:'Nurse Levi', c:'#10b981', text:'מתחילים Parkland — 4 מ"ל × 90 ק"ג × 35%.'},
      {s:'Dr. Stern', c:'#ec4899', text:'נתיב אוויר תקין. SpO2 97%.'},
    ]
  },
];

const S = { dark: false };

function init() {
  document.getElementById('stat-unsigned-n').textContent =
    INCIDENTS.filter(i => i.status === 'draft').length;
  renderStats();
  renderRows(INCIDENTS);
}

function toggleDark() {
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  document.getElementById('theme-icon').textContent = S.dark ? '☀️' : '🌙';
}

function renderStats() {
  const unsigned = INCIDENTS.filter(i => i.status === 'draft').length;
  const signed   = INCIDENTS.filter(i => i.status === 'signed').length;
  const totalMin = INCIDENTS.reduce((a,i) => a + parseInt(i.duration), 0);
  const cards = [
    { icon:'📋', val:INCIDENTS.length, label:'Total Incidents', he:'סה"כ אירועים', cls:'bg-[#ece9e1] dark:bg-[#252528]' },
    { icon:'✅', val:signed,           label:'Signed',          he:'מאושרים',      cls:'bg-green-50 dark:bg-green-900/20' },
    { icon:'⏳', val:unsigned,         label:'Unsigned',        he:'ממתינים לחתימה', cls:'bg-yellow-50 dark:bg-yellow-900/20' },
    { icon:'⏱', val:Math.round(totalMin/INCIDENTS.length)+' min', label:'Avg Duration', he:'משך ממוצע', cls:'bg-blue-50 dark:bg-blue-900/20' },
  ];
  document.getElementById('stat-cards').innerHTML = cards.map(c =>
    `<div class="${c.cls} rounded-xl p-4 border border-[#d8d2c8] dark:border-[#3a3835]">
      <div class="text-2xl mb-2">${c.icon}</div>
      <div class="text-2xl font-bold tabular-nums">${c.val}</div>
      <div class="text-xs text-[#8a8070] dark:text-[#a8a29e] mt-0.5">${c.label}</div>
      <div class="text-[9px] text-[#a8a29e]" dir="rtl">${c.he}</div>
    </div>`).join('');
}

function fmtDate(d) {
  return new Date(d+'T00:00:00').toLocaleDateString('he-IL',{day:'2-digit',month:'short',year:'numeric'});
}

function renderRows(list) {
  const el = document.getElementById('incident-list');
  const nr = document.getElementById('no-results');
  if (!list.length) { el.innerHTML=''; nr.classList.remove('hidden'); return; }
  nr.classList.add('hidden');
  el.innerHTML = list.map(inc => {
    const badge = inc.status === 'signed'
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400">✓ Signed</span>`
      : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400">⏳ Draft</span>`;
    return `
    <div class="fade-up grid grid-cols-[1fr_1fr_1fr_80px_108px_72px] items-center px-5 py-3.5 border-b border-[#d8d2c8] dark:border-[#3a3835] last:border-0 hover:bg-[#f7f4ef] dark:hover:bg-[#252528] transition-colors cursor-pointer"
      onclick="openModal('${inc.id}')">
      <div>
        <div class="text-sm font-medium">${fmtDate(inc.date)}</div>
        <div class="text-[10px] text-[#8a8070] dark:text-[#a8a29e] tabular-nums">${inc.time}</div>
      </div>
      <div class="font-mono text-xs text-[#8a8070] dark:text-[#a8a29e]">#${inc.id}</div>
      <div>
        <div class="text-sm">${inc.typeEn}</div>
        <div class="text-[10px] text-[#8a8070] dark:text-[#a8a29e]" dir="rtl">${inc.typeHe}</div>
      </div>
      <div class="text-sm tabular-nums text-[#8a8070] dark:text-[#a8a29e]">${inc.duration}</div>
      <div>${badge}</div>
      <div><button class="text-xs text-[#c15f3c] hover:text-[#a04e31] font-medium transition-colors" onclick="event.stopPropagation();openModal('${inc.id}')">View →</button></div>
    </div>`;
  }).join('');
}

function filterRows() {
  const q  = document.getElementById('search-input').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  renderRows(INCIDENTS.filter(i =>
    (!q  || i.id.toLowerCase().includes(q) || i.typeEn.toLowerCase().includes(q) || i.typeHe.includes(q)) &&
    (!st || i.status === st)
  ));
}

function openModal(id) {
  const inc = INCIDENTS.find(i => i.id === id);
  if (!inc) return;
  document.getElementById('modal-title').textContent = `${inc.typeEn} — #${inc.id}`;
  document.getElementById('modal-sub').textContent   = `${fmtDate(inc.date)} · ${inc.time} · ${inc.duration}`;
  document.getElementById('modal-signed').textContent = inc.status === 'signed'
    ? `✓ Signed by ${inc.nurse}` : '⏳ Awaiting signature';

  document.getElementById('modal-body').innerHTML = `
    <div class="space-y-5">
      <div>
        <div class="text-[9px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold mb-3">Transcript Snippet</div>
        <div class="space-y-2">
          ${inc.snippet.map(e => `
            <div class="flex gap-2.5 pl-3" style="border-left:2px solid ${e.c}">
              <div>
                <div class="text-[10px] font-semibold" style="color:${e.c}">${e.s}</div>
                <div class="text-sm leading-relaxed" dir="rtl">${e.text}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <div class="text-[9px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold mb-2">Interventions</div>
          <ul class="space-y-1">${inc.interventions.map(x => `<li class="flex items-start gap-1.5 text-xs"><span class="text-[#c15f3c]">⚕</span>${x}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="text-[9px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold mb-2">Medications</div>
          <ul class="space-y-1">${inc.meds.map(x => `<li class="flex items-start gap-1.5 text-xs"><span class="text-purple-500">💊</span>${x}</li>`).join('')}</ul>
        </div>
      </div>
      ${inc.outcome
        ? `<div><div class="text-[9px] uppercase tracking-widest text-[#8a8070] dark:text-[#a8a29e] font-semibold mb-2">Outcome</div>
           <div class="text-sm leading-relaxed p-3 bg-[#f5f1ec] dark:bg-[#252420] rounded-lg">${inc.outcome}</div></div>`
        : `<div class="p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded-lg text-xs text-yellow-700 dark:text-yellow-400">⏳ Summary not yet finalized — open room to complete.</div>`}
    </div>`;

  const ov = document.getElementById('modal-overlay');
  const bx = document.getElementById('modal-box');
  ov.classList.remove('hidden');
  requestAnimationFrame(() => {
    ov.style.opacity = '1';
    bx.style.opacity = '1';
    bx.style.transform = 'scale(1)';
  });
}

function closeModal() {
  const ov = document.getElementById('modal-overlay');
  const bx = document.getElementById('modal-box');
  ov.style.opacity = '0';
  bx.style.opacity = '0';
  bx.style.transform = 'scale(0.95)';
  setTimeout(() => ov.classList.add('hidden'), 220);
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
